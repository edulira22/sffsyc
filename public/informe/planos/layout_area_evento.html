<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Área del evento DIF</title>
<style>
[hidden]{display:none!important}   /* lo oculto nunca debe tapar ni recibir clics */
/* Plano de evento: se ve como papel (tema claro fijo, a propósito). */
:root{
  --papel:#FAFAF8; --tinta:#263238; --tinta-suave:#607D8B; --panel:#FFFFFF; --borde:#CFD8DC;
  --acento:#00897B; --acento-fondo:#E0F2EF; --sombra:0 2px 10px rgba(38,50,56,.18);
  color-scheme:light;
}
html,body{margin:0;height:100%;background:var(--papel);color:var(--tinta);
  font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#s{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--papel);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}   /* arrastrar para navegar sin seleccionar textos */
#s:active{cursor:grabbing}
body{user-select:none;-webkit-user-select:none}   /* el visor es para navegar: nada de texto seleccionado al arrastrar */
#p{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:10px;
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;box-shadow:var(--sombra);
  width:min(280px,calc(100vw - 20px));max-height:calc(100% - 90px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;overflow:hidden}
#cab{display:flex;align-items:center;gap:8px;padding:8px 10px}
#cab b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-suave)}
#aforo{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#cuerpo{overflow:auto;padding:0 10px 10px;border-top:1px solid var(--borde)}
#t label{display:flex;align-items:center;gap:8px;min-height:34px;cursor:pointer;border-bottom:1px solid #ECEFF1}
#t label:last-child{border-bottom:0}
#t input{width:18px;height:18px;accent-color:var(--acento);margin:0}
button{font:inherit;border:1px solid var(--borde);background:var(--panel);color:var(--tinta);border-radius:8px;
  min-height:36px;padding:0 12px;cursor:pointer}
button:focus-visible,#t input:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
#bCapas{background:var(--acento-fondo);border-color:var(--acento);color:#00695C;font-weight:600}
#vistas{display:flex;gap:8px;padding:10px 0 6px}
#vistas button{flex:1}
#bSolo[aria-pressed=true]{background:var(--acento);border-color:var(--acento);color:#fff}
#zoom{position:fixed;z-index:3;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#zoom button{width:44px;height:44px;padding:0;font-size:22px;box-shadow:var(--sombra)}
#zFoto{display:grid;place-items:center}
#rev{position:fixed;z-index:2;right:10px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--tinta-suave);opacity:.7;pointer-events:none}
#avisoFoto{position:fixed;z-index:9;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#263238;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}

#c{position:fixed;z-index:3;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);
  border:1px solid var(--borde);padding:4px 8px;border-radius:6px;font-size:12px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
@media (max-width:700px){ #c{display:none} }
#p2{position:fixed;z-index:3;left:10px;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(280px,calc(100vw - 20px));
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;box-shadow:var(--sombra);max-height:45%;display:flex;flex-direction:column;overflow:hidden}
#p2 .cab2{padding:8px 10px}
#t2{overflow:auto;padding:0 10px 10px;border-top:1px solid var(--borde)}
#t2 label{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;border-bottom:1px solid #ECEFF1}
#t2 input{width:18px;height:18px;accent-color:var(--acento);margin:0}
#bAco{background:#FFF3E0;border-color:#FB8C00;color:#E65100;font-weight:600}
@media (max-width:700px){ #p2{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))} }
#ley{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));right:10px;
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;box-shadow:var(--sombra);
  width:min(250px,calc(100vw - 20px));max-height:calc(100% - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;overflow:hidden}
#leyCab{display:flex;justify-content:flex-end;padding:8px 10px}
#leyCuerpo{overflow:auto;padding:0 12px 10px;border-top:1px solid var(--borde)}
#leyCuerpo h3{margin:10px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave)}
.fila{display:flex;align-items:center;gap:8px;min-height:24px;font-size:13px}
.mues{flex:none;width:22px;height:13px;border-radius:3px;border:1.5px solid transparent}
.bloques{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-variant-numeric:tabular-nums;font-size:13px}
.bloques b{color:#B71C1C}
.total{display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid var(--borde);font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:700px){ #ley{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:auto;left:10px} #ley:has(#leyCuerpo:not([hidden])){max-height:55%} }
</style>
<div id="p">
  <div id="cab"><button id="bCapas" aria-expanded="true" aria-controls="cuerpo">Capas ▾</button><span id="aforo"></span></div>
  <div id="cuerpo">
    <div id="vistas"><button id="bE">Zona del evento</button><button id="bT">Todo el plano</button></div>
    <div style="display:flex;padding:0 0 6px"><button id="bSolo" aria-pressed="false" style="flex:1">Ver solo el área del evento</button></div>
    <div id="vistas2" style="display:flex;padding:0 0 6px"><button id="bAsig" style="flex:1">Asignaciones: visibles</button></div>
    <div id="t"></div>
  </div>
</div>
<div id="ley">
  <div id="leyCab"><button id="bLey" aria-expanded="true" aria-controls="leyCuerpo">Leyenda ▾</button></div>
  <div id="leyCuerpo"><div id="leyZonas"></div><h3>Bloques de sillas</h3><div class="bloques" id="leyBloques"></div><div class="total" id="leyTotal"></div></div>
</div>

  <div id="t2"></div>
</div>

  return {x: (p[0].x + p[1].x) / 2 - r.left, y: (p[0].y + p[1].y) / 2 - r.top, d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)};
